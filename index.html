<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- leaflet css -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />

    <title>Web-GIS Batas Kecamatan dengan GeoServer dan Leaflet</title>

    <style>
      body {
        margin: 0;
        padding: 0;
      }
      #map {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <!-- leaflet js -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <!-- jquery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <!-- plugin leaflet-geoserver-request -->
    <script src="lib/L.Geoserver.js"></script>

    <script>
      // Peta langsung diarahkan ke bbox layer batas_kecamatan
      // bbox: minx, miny, maxx, maxy -> Leaflet: [[lat_min, lng_min], [lat_max, lng_max]]
      var map = L.map("map");
      map.fitBounds([
        [-8.647220457999936, 122.6477921720001],
        [-8.063357603999975, 123.33921143000009],
      ]);

      var osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      });
      osm.addTo(map);

      // ===== WMS =====
      var wmsLayer = L.Geoserver.wms("http://localhost:8080/geoserver/pgweb/wms", {
        layers: "pgweb:batas_kecamatan",
        transparent: true,
        format: "image/png",
        attribution: "Batas Kecamatan",
        // CQL_FILTER: "nama_kecamatan='NAMA'",  // contoh filter, sesuaikan nama kolom
      });
      wmsLayer.addTo(map);

      // ===== WFS (opsional, aktifkan dengan menghapus komentar addTo) =====
      var wfsLayer = L.Geoserver.wfs("http://localhost:8080/geoserver/pgweb/wfs", {
        layers: "pgweb:batas_kecamatan",
        style: {
          color: "black",
          weight: 1,
          fillOpacity: 0.3,
          fillColor: "red",
        },
        onEachFeature: function (feature, layer) {
          // Popup otomatis menampilkan semua atribut layer
          var html = "<table>";
          for (var key in feature.properties) {
            html += "<tr><td><b>" + key + "</b></td><td>" + feature.properties[key] + "</td></tr>";
          }
          html += "</table>";
          layer.bindPopup(html);
        },
      });
      // wfsLayer.addTo(map);

      // ===== Legenda =====
      var layerLegend = L.Geoserver.legend("http://localhost:8080/geoserver/pgweb/wms", {
        layers: "pgweb:batas_kecamatan",
      });
      layerLegend.addTo(map);

      // Kontrol layer
      L.control
        .layers({ OpenStreetMap: osm }, { "Batas Kecamatan (WMS)": wmsLayer, "Batas Kecamatan (WFS)": wfsLayer })
        .addTo(map);
    </script>
  </body>
</html>
